name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Python tools
        run: |
          python3 -m py_compile \
            skills/yup-build-plugin/scripts/verify_artifacts.py \
            skills/yup-ci-maintainer/scripts/validate_reusable_ci.py
          python3 -m unittest discover -s tests -v
